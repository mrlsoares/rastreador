# ============================================================
# nginx — rastreador.ddnsgratis.com.br
# Espelho versionado de /etc/nginx/conf.d/rastreador.conf (servidor de produção).
# Editou lá? Reflita aqui (e vice-versa). Certbot gere os certs.
#
# COMPATIBILIDADE MODEM SIM7080G (firmware R1951.04):
#   O modem só fala TLS 1.2 (não tem 1.3) e o cert Let's Encrypt é ECDSA P-256.
#   Por isso o vhost HTTPS habilita TLS 1.2 com ciphers ECDHE-ECDSA-GCM — sem
#   isso o handshake do modem falha (AT+CAOPEN retorna 0,27 / TLS alert 40).
#   O include options-ssl-nginx.conf fica COMENTADO porque também define
#   ssl_ciphers (duplicaria a diretiva e o nginx recusa iniciar).
# ============================================================

# ---------- HTTP: redireciona para HTTPS ----------
server {
    listen 80;
    server_name rastreador.ddnsgratis.com.br;

    # Renovação do Certbot
    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        allow all;
        root /var/www/rastreador/public;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

# ---------- HTTPS: aplicação Laravel ----------
server {
    listen 443 ssl;
    http2 on;
    server_name rastreador.ddnsgratis.com.br;

    root /var/www/rastreador/public;
    index index.php index.html index.htm;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    # ===== SSL (certs geridos pelo Certbot) =====
    ssl_certificate /etc/letsencrypt/live/rastreador.ddnsgratis.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rastreador.ddnsgratis.com.br/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;   # COMENTADO: duplicaria ssl_ciphers
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ===== COMPATIBILIDADE MODEM SIM7080G (TLS 1.2 + ECDHE-ECDSA) =====
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;

    # ===== Logs =====
    access_log /var/log/nginx/rastreador_access.log;
    error_log /var/log/nginx/rastreador_error.log;

    # ===== Aplicação Laravel =====
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ===== WebSockets (Reverb) =====
    location /app {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ===== PHP-FPM =====
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }
}
